{% set tabs = [("/recovery/", "Overview"), ("/recovery/sleep", "Sleep"), ("/recovery/lag", "Training & sleep"),("/recovery/sync", "Sync")] %}
<div class="tabs">
  {% for href, label in tabs %}
  <a href="{{ href }}"{% if request.url.path == href %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</div>
